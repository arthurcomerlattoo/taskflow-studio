name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      
      # Compila o projeto de forma estática tradicional
      - run: npx vite build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      
      # PROCURA O INDEX E CRIA O 404 AUTOMATICAMENTE (Não importa a pasta que o TanStack gerou)
      - name: Duplicar index para 404
        run: |
          INDEX_PATH=$(find . -name "index.html" -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$INDEX_PATH" ]; then
            echo "Erro: index.html nao encontrado!" && exit 1
          fi
          DIR_PATH=$(dirname "$INDEX_PATH")
          cp "$INDEX_PATH" "$DIR_PATH/404.html"
          echo "DEPLOY_PATH=$DIR_PATH" >> $GITHUB_ENV

      - uses: actions/configure-pages@v5
      
      # Publica dinamicamente a pasta exata encontrada pelo script acima
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.DEPLOY_PATH }}
          
      - uses: actions/deploy-pages@v4
